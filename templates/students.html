{% extends 'base.html' %}
{% block title %}Students{% endblock %}

{% block content %}

<div class="container mt-4">

    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addStudentModal">
        Add Student
    </button>

    <!-- Modal -->
    <div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addStudentModalLabel">Add Student</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form action="{{ url_for('add_students') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="f_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="className" class="form-label">Class</label>
                            <input type="text" class="form-control" id="className" name="class" required>
                        </div>
                        <div class="mb-3">
                            <label for="admNo" class="form-label">Admission Number</label>
                            <input type="text" class="form-control" id="admNo" name="adm_no" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Add Student</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Table — outside the modal -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Class</th>
                <th>Adm No</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.class }}</td>
                <td>{{ s.adm_number }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
