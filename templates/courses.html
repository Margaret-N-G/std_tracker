{% extends 'base.html' %}
{% block title %}Courses{% endblock %}

{% block content %}

<button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addCourseModal">
    Add Course
</button>

<!-- Modal -->
<div class="modal fade" id="addCourseModal" tabindex="-1" aria-labelledby="addCourseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h1 class="modal-title fs-5" id="addCourseModalLabel">Add Course</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="{{ url_for('add_courses') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="modal-body">
                    <div class="mb-3">
                        <label for="courseName" class="form-label">Course Name</label>
                        <input type="text" class="form-control" id="courseName" name="c_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="teacherId" class="form-label">Teacher ID</label>
                        <input type="number" class="form-control" id="teacherId" name="t_id" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Add Course</button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Table — OUTSIDE the modal -->
<table class="table table-striped">
    <thead>
        <tr>
            <th>Course Name</th>
            <th>Teacher ID</th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ course.name }}</td>
            <td>{{ course.teacher_id }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
